<section id="skills" class="skills">
  <div class="skills__container">
    <div class="skills__card">
      <h1 class="skills__title">Tech Arsenal</h1>

      <div class="skills__grid">
        @for (category of categories(); track category.title) {
          <div class="skills__category">
            <div
              class="skills__category-header skills__category-header--{{ category.color }}"
              [style.transform]="'rotate(' + category.rotation + ')'">
              <i [class]="category.icon"></i>
              <h2>{{ category.title }}</h2>
            </div>
            <div class="skills__tags">
              @for (skill of category.skills; track skill) {
                <span class="skills__tag skills__tag--{{ category.hoverColor }}">{{ skill }}</span>
              }
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
