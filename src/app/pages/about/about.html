<section id="about" class="about">
  <div class="about__container">
    <div class="about__layout">
      <!-- Left: Title -->
      <div class="about__title-wrap">
        <h1 class="about__title">About<br>Me</h1>
      </div>

      <!-- Right: Content -->
      <div class="about__content">
        <!-- Decorative pins -->
        <div class="about__pin about__pin--tl"></div>
        <div class="about__pin about__pin--tr"></div>
        <div class="about__pin about__pin--bl"></div>
        <div class="about__pin about__pin--br"></div>

        <div class="about__bio">
          <p>{{ bio() }}</p>
        </div>

        <div class="about__stats">
          @for (stat of stats(); track stat.label) {
            <div class="about__stat about__stat--{{ stat.color }}">
              <span class="about__stat-value">
                @if (stat.value) {
                  <span>{{ stat.value }}</span>
                }
                @if (stat.icon) {
                  <i [class]="stat.icon" style="margin-left: 0.25rem;"></i>
                }
              </span>
              <span class="about__stat-label">{{ stat.label }}</span>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
