<section id="hero" class="hero">
  <app-shader-background />
  <div class="hero__container">
    <div class="hero__grid">
      <!-- Left: Text content -->
      <div class="hero__content">
        <p class="hero__eyebrow">Aiman Syafiq · Full-stack engineer</p>

        <h1 class="hero__title">
          Building digital<br>
          products that<br>
          <span class="hero__title-highlight">hold up.</span>
        </h1>

        <p class="hero__description">
          I build dependable web and mobile applications with Angular, Ionic, TypeScript, and Node.js — from thoughtful interfaces to reliable data flows.
        </p>

        <div class="hero__actions">
          <a href="#projects" (click)="scrollTo('projects')" class="hero__btn hero__btn--primary">
            View selected work <i class="ph-bold ph-arrow-down-right"></i>
          </a>
          <a href="https://github.com/aimancapik" target="_blank" rel="noopener noreferrer"
            class="hero__btn hero__btn--secondary">
            <i class="ph-fill ph-github-logo"></i> GitHub
          </a>
        </div>
      </div>

      <!-- Right: Brutalist Graphic -->
      <div class="hero__graphic">
        <div class="hero__deco-circle"></div>
        <div class="hero__deco-square"></div>

        <div class="hero__avatar">
          <div class="hero__avatar-tag">Available for opportunities</div>
          <div class="hero__avatar-placeholder">
            <img src="assets/aiman-capik.JPG" alt="Aiman Syafiq" class="hero__avatar-image">
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
