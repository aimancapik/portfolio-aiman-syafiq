<section id="projects" class="projects">
  <div class="projects__container">
    <div class="projects__header">
      <h1 class="projects__title">
        Selected <span class="projects__title-accent">Works</span>
      </h1>
      <p class="projects__subtitle">Stuff I built recently. Warning: They load blazingly fast.</p>
    </div>

    <div class="projects__grid">
      @for (project of projects(); track project.title) {
        <article class="project-card project-card--{{ project.accentColor }}">
          <div class="project-card__image">
            <div class="project-card__placeholder">
              <i class="ph-bold ph-code-block"></i>
              <span>{{ project.title }}</span>
            </div>
            <div class="project-card__tags">
              @for (tag of project.tags; track tag) {
                <span class="project-card__tag">{{ tag }}</span>
              }
            </div>
          </div>
          <div class="project-card__body">
            <h2 class="project-card__title">{{ project.title }}</h2>
            <p class="project-card__desc">{{ project.description }}</p>
            <div class="project-card__actions">
              <a [href]="project.liveUrl" class="project-card__btn project-card__btn--primary">Live</a>
              <a [href]="project.codeUrl" class="project-card__btn project-card__btn--secondary">
                <i class="ph-bold ph-github-logo"></i> Code
              </a>
            </div>
          </div>
        </article>
      }
    </div>
  </div>
</section>
