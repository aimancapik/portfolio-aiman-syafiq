<nav class="navbar">
  <div class="navbar__container">
    <div class="navbar__inner">
      <a href="#hero" class="navbar__logo" (click)="scrollTo('hero')">
        <div class="navbar__logo-icon">
          <i class="ph-bold ph-code"></i>
        </div>
        <span class="navbar__logo-text">AIMAN.DEV</span>
      </a>

      <div class="navbar__desktop-menu">
        <a href="#about" class="navbar__link" (click)="scrollTo('about')">About</a>
        <a href="#projects" class="navbar__link" (click)="scrollTo('projects')">Work</a>
        <a href="#skills" class="navbar__link" (click)="scrollTo('skills')">Skills</a>
        <a href="#contact" class="navbar__cta" (click)="scrollTo('contact')">
          <span>Say Hi</span>
          <i class="ph-bold ph-paper-plane-right"></i>
        </a>
      </div>

      <button
        class="navbar__mobile-btn"
        (click)="toggleMenu()"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-label="Toggle navigation menu">
        <i class="ph-bold ph-list"></i>
      </button>
    </div>
  </div>
</nav>

<!-- Mobile Menu Overlay -->
@if (mobileMenuOpen()) {
  <div class="mobile-menu" role="dialog" aria-label="Navigation menu">
    <button class="mobile-menu__close" (click)="closeMenu()" aria-label="Close navigation menu">
      <i class="ph-bold ph-x"></i>
    </button>
    <a href="#about" class="mobile-menu__link" (click)="scrollTo('about')">About</a>
    <a href="#projects" class="mobile-menu__link" (click)="scrollTo('projects')">Work</a>
    <a href="#skills" class="mobile-menu__link" (click)="scrollTo('skills')">Skills</a>
    <a href="#contact" class="mobile-menu__link" (click)="scrollTo('contact')">Contact</a>
  </div>
}
