<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc">
  <title id="title">Loopdale lead automation workflow</title>
  <desc id="desc">One enquiry form is validated and sent through an Express API to Google Sheets, Telegram, and customer email.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#16312d" stroke-opacity=".07"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="0" flood-color="#142623" flood-opacity="1"/></filter>
  </defs>
  <rect width="720" height="1280" fill="#f4f1e8"/>
  <rect width="720" height="1280" fill="url(#grid)"/>
  <rect x="0" y="0" width="720" height="86" fill="#142623"/>
  <text x="40" y="54" fill="#d9ff57" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">LOOPDALE · AUTOMATION FLOW</text>

  <text x="40" y="158" fill="#142623" font-family="Arial,sans-serif" font-size="70" font-weight="900">ONE LEAD.</text>
  <text x="40" y="226" fill="#0e8791" font-family="Arial,sans-serif" font-size="70" font-weight="900">THREE ACTIONS.</text>
  <text x="42" y="272" fill="#52615e" font-family="Arial,sans-serif" font-size="22">A simple enquiry becomes a trackable service workflow.</text>

  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="40" y="320" width="192" height="112" rx="4" fill="#d9ff57" stroke="#142623" stroke-width="3" filter="url(#shadow)"/>
    <text x="136" y="365" font-size="38" font-weight="900" fill="#142623">01</text><text x="136" y="400" font-size="16" font-weight="700" fill="#142623">ENQUIRY FORM</text>
    <rect x="264" y="320" width="192" height="112" rx="4" fill="#0e8791" stroke="#142623" stroke-width="3" filter="url(#shadow)"/>
    <text x="360" y="365" font-size="38" font-weight="900" fill="#fff">02</text><text x="360" y="400" font-size="16" font-weight="700" fill="#fff">VALIDATE</text>
    <rect x="488" y="320" width="192" height="112" rx="4" fill="#fff" stroke="#142623" stroke-width="3" filter="url(#shadow)"/>
    <text x="584" y="365" font-size="38" font-weight="900" fill="#142623">03</text><text x="584" y="400" font-size="16" font-weight="700" fill="#142623">POST /API/LEADS</text>
  </g>
  <path d="M232 376h32m192 0h32" stroke="#142623" stroke-width="4" stroke-dasharray="8 8"/>

  <rect x="40" y="492" width="640" height="112" rx="4" fill="#142623"/>
  <text x="70" y="535" fill="#d9ff57" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">EXPRESS ORCHESTRATION</text>
  <text x="70" y="574" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Store first. Notify clearly. Reply automatically.</text>

  <path d="M360 604v64M140 668h440M140 668v46M360 668v46M580 668v46" fill="none" stroke="#142623" stroke-width="4"/>
  <g font-family="Arial,sans-serif">
    <rect x="40" y="714" width="200" height="210" rx="4" fill="#fff" stroke="#142623" stroke-width="3"/>
    <circle cx="82" cy="758" r="20" fill="#d9ff57" stroke="#142623" stroke-width="3"/><text x="82" y="766" text-anchor="middle" font-size="22" font-weight="900">1</text>
    <text x="68" y="810" font-size="24" font-weight="900" fill="#142623">GOOGLE SHEETS</text>
    <text x="68" y="850" font-size="17" fill="#52615e">Append lead data</text><text x="68" y="878" font-size="17" fill="#52615e">through Apps Script.</text>

    <rect x="260" y="714" width="200" height="210" rx="4" fill="#0e8791" stroke="#142623" stroke-width="3"/>
    <circle cx="302" cy="758" r="20" fill="#d9ff57" stroke="#142623" stroke-width="3"/><text x="302" y="766" text-anchor="middle" font-size="22" font-weight="900">2</text>
    <text x="288" y="810" font-size="24" font-weight="900" fill="#fff">TELEGRAM</text>
    <text x="288" y="850" font-size="17" fill="#e8ffff">Alert the owner and</text><text x="288" y="878" font-size="17" fill="#e8ffff">update lead status.</text>

    <rect x="480" y="714" width="200" height="210" rx="4" fill="#fff" stroke="#142623" stroke-width="3"/>
    <circle cx="522" cy="758" r="20" fill="#d9ff57" stroke="#142623" stroke-width="3"/><text x="522" y="766" text-anchor="middle" font-size="22" font-weight="900">3</text>
    <text x="508" y="810" font-size="24" font-weight="900" fill="#142623">EMAIL</text>
    <text x="508" y="850" font-size="17" fill="#52615e">Send an automatic</text><text x="508" y="878" font-size="17" fill="#52615e">customer reply.</text>
  </g>

  <text x="40" y="1000" fill="#142623" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">LEAD STATUS PIPELINE · 6 STATES</text>
  <g font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <rect x="40" y="1030" width="194" height="58" rx="29" fill="#d9ff57" stroke="#142623" stroke-width="2"/><text x="137" y="1066">NEW</text>
    <rect x="263" y="1030" width="194" height="58" rx="29" fill="#fff" stroke="#142623" stroke-width="2"/><text x="360" y="1066">CONTACTED</text>
    <rect x="486" y="1030" width="194" height="58" rx="29" fill="#fff" stroke="#142623" stroke-width="2"/><text x="583" y="1066">QUOTED</text>
    <rect x="40" y="1108" width="194" height="58" rx="29" fill="#fff" stroke="#142623" stroke-width="2"/><text x="137" y="1144">BOOKED</text>
    <rect x="263" y="1108" width="194" height="58" rx="29" fill="#0e8791" stroke="#142623" stroke-width="2"/><text x="360" y="1144" fill="#fff">WON</text>
    <rect x="486" y="1108" width="194" height="58" rx="29" fill="#fff" stroke="#142623" stroke-width="2"/><text x="583" y="1144">LOST</text>
  </g>
  <text x="40" y="1232" fill="#52615e" font-family="Arial,sans-serif" font-size="17">Node.js · Express · Google Apps Script · Telegram Bot · SMTP</text>
</svg>
